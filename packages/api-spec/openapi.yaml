openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ResolveAI resolution copilot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: cases
    description: Customer issue cases
  - name: orders
    description: Mock customer orders
  - name: analytics
    description: Agent analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMe
      tags: [auth]
      summary: Update the current user's name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
  /orders/mine:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List orders for the current customer
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /cases:
    get:
      operationId: getCases
      tags: [cases]
      summary: List cases for agents with filters and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Priority"
        - $ref: "#/components/parameters/Category"
        - name: escalated
          in: query
          schema:
            type: boolean
        - name: includeArchived
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, priority, due_soonest]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Cases with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCases"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a case from a customer issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "400":
          $ref: "#/components/responses/Error"
  /cases/mine:
    get:
      operationId: getMyCases
      tags: [cases]
      summary: List cases for the current customer (customer-safe fields only)
      responses:
        "200":
          description: Customer cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerCase"
  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case and its history (customer gets safe view, agent gets full workspace view)
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /cases/{id}/messages:
    post:
      operationId: addCaseMessage
      tags: [cases]
      summary: Add a message to a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /cases/{id}/attachments:
    post:
      operationId: uploadAttachment
      tags: [cases]
      summary: Upload evidence to a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "201":
          description: Attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
  /attachments/{id}/url:
    get:
      operationId: getAttachmentUrl
      tags: [cases]
      summary: Get a signed URL for an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUrlResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /cases/{id}/generate-reply:
    post:
      operationId: generateReply
      tags: [cases]
      summary: Generate an agent reply draft with policy cited and warnings
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyInput"
      responses:
        "200":
          description: Draft reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
  /cases/{id}/send-reply:
    post:
      operationId: sendReply
      tags: [cases]
      summary: Send an agent reply
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /cases/{id}/resolution-plan:
    post:
      operationId: generateResolutionPlan
      tags: [cases]
      summary: Generate an AI checklist resolution plan for a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Resolution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolutionPlanResponse"
  /cases/{id}/status:
    patch:
      operationId: updateCaseStatus
      tags: [cases]
      summary: Change case status
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{id}/override:
    patch:
      operationId: overrideCase
      tags: [cases]
      summary: Override an AI field with required reason
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{id}/assign:
    post:
      operationId: assignCase
      tags: [cases]
      summary: Assign a case to the logged-in agent
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{id}/archive:
    post:
      operationId: archiveCase
      tags: [cases]
      summary: Archive a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Archived case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /cases/{id}/promises:
    get:
      operationId: getCasePromises
      tags: [cases]
      summary: Get all promises for a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Promises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromiseItem"
    put:
      operationId: updateCasePromise
      tags: [cases]
      summary: Add or update a promise on a case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseInput"
      responses:
        "200":
          description: Updated promise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseItem"
  /promises/{id}:
    patch:
      operationId: updatePromiseStatus
      tags: [cases]
      summary: Update promise status (e.g. mark kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromiseStatusInput"
      responses:
        "200":
          description: Updated promise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseItem"
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Agent resolution metrics summary
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    UserRole:
      type: string
      enum: [customer, agent]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
      required: [id, name, email, role]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
      required: [token, user]
    UpdateMeInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
      required: [name]
    Order:
      type: object
      properties:
        id: { type: integer }
        order_code: { type: string }
        user_id: { type: integer }
        product_name: { type: string }
        price: { type: number }
        order_date: { type: string }
        delivery_date: { type: string }
        status: { type: string }
      required: [id, order_code, user_id, product_name, price, order_date, delivery_date, status]
    CustomerCase:
      type: object
      properties:
        id: { type: integer }
        case_code: { type: string }
        status: { type: string }
        category: { type: string }
        summary: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        due_at: { type: string }
        order_id: { type: ["integer", "null"] }
        order: { anyOf: [{ $ref: "#/components/schemas/Order" }, { type: "null" }] }
      required: [id, case_code, status, category, summary, created_at, updated_at, due_at]
    Case:
      type: object
      properties:
        id: { type: integer }
        case_code: { type: string }
        user_id: { type: integer }
        order_id: { type: ["integer", "null"] }
        status: { type: string }
        category: { type: string }
        priority: { type: string }
        sentiment: { type: string }
        customer_intent: { type: string }
        summary: { type: string }
        recommended_action: { type: string }
        next_step: { type: string }
        escalation_required: { type: boolean }
        escalation_reason: { type: ["string", "null"] }
        missing_information:
          type: array
          items: { type: string }
        resolution_plan:
          type: array
          items: { type: string }
        assigned_agent_id: { type: ["integer", "null"] }
        ai_failed: { type: boolean }
        ai_source: { type: string, enum: [groq, fallback] }
        archived: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        due_at: { type: string }
        customer_name: { type: ["string", "null"] }
        order: { anyOf: [{ $ref: "#/components/schemas/Order" }, { type: "null" }] }
      required:
        [id, case_code, user_id, status, category, summary, created_at, updated_at, due_at]
    PaginatedCases:
      type: object
      properties:
        cases:
          type: array
          items: { $ref: "#/components/schemas/Case" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [cases, total]
    CaseInput:
      type: object
      properties:
        message: { type: string, minLength: 10 }
        order_id: { type: ["integer", "null"] }
      required: [message]
    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            timeline:
              type: array
              items: { $ref: "#/components/schemas/CaseEvent" }
            messages:
              type: array
              items: { $ref: "#/components/schemas/Message" }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            promises:
              type: array
              items: { $ref: "#/components/schemas/PromiseItem" }
          required: [timeline, messages, attachments]
    CaseEventMetadata:
      type: object
      additionalProperties: true
    CaseEvent:
      type: object
      properties:
        id: { type: integer }
        case_id: { type: integer }
        event_type: { type: string }
        description: { type: string }
        actor_type: { type: string }
        actor_id: { type: ["integer", "null"] }
        created_at: { type: string }
        metadata: { $ref: "#/components/schemas/CaseEventMetadata" }
        visible_to_customer: { type: boolean }
      required: [id, case_id, event_type, description, actor_type, created_at]
    MessageSenderType:
      type: string
      enum: [customer, agent]
    Message:
      type: object
      properties:
        id: { type: integer }
        case_id: { type: integer }
        sender_type: { $ref: "#/components/schemas/MessageSenderType" }
        body: { type: string }
        created_at: { type: string }
      required: [id, case_id, sender_type, body, created_at]
    MessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1 }
      required: [body]
    Attachment:
      type: object
      properties:
        id: { type: integer }
        case_id: { type: integer }
        file_name: { type: string }
        file_path: { type: string }
        storage_path: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string }
      required: [id, case_id, file_name, file_path, uploaded_at]
    AttachmentUrlResponse:
      type: object
      properties:
        url: { type: string }
        expires_in: { type: integer }
      required: [url, expires_in]
    AttachmentUploadInput:
      type: object
      properties:
        file_name: { type: string, minLength: 1 }
        file_data: { type: string, minLength: 1 }
      required: [file_name, file_data]
    ReplyInputTone:
      type: string
      enum: [warm, concise, professional]
    ReplyInput:
      type: object
      properties:
        body: { type: string, minLength: 1 }
        tone: { $ref: "#/components/schemas/ReplyInputTone" }
      required: [body]
    ReplyDraft:
      type: object
      properties:
        draft: { type: string }
        policy_cited: { type: ["string", "null"] }
        warnings:
          type: array
          items: { type: string }
      required: [draft, warnings]
    ResolutionPlanResponse:
      type: object
      properties:
        plan:
          type: array
          items: { type: string }
      required: [plan]
    StatusInputStatus:
      type: string
      enum: [New, Investigating, Awaiting Customer, Approved, Resolved, Rejected]
    StatusInput:
      type: object
      properties:
        status: { $ref: "#/components/schemas/StatusInputStatus" }
      required: [status]
    OverrideInput:
      type: object
      properties:
        field: { type: string }
        value: { type: string }
        reason: { type: string, minLength: 1 }
      required: [field, value, reason]
    AssignInput:
      type: object
      properties:
        agent_id: { type: integer }
    PromiseItem:
      type: object
      properties:
        id: { type: integer }
        case_id: { type: integer }
        text: { type: string }
        due_at: { type: string }
        status: { type: string, enum: [pending, kept, broken] }
        created_at: { type: string }
      required: [id, case_id, text, due_at, status, created_at]
    PromiseInput:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        due_at: { type: string }
      required: [text, due_at]
    UpdatePromiseStatusInput:
      type: object
      properties:
        status: { type: string, enum: [pending, kept, broken] }
      required: [status]
    AnalyticsPoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
      required: [label, value]
    AnalyticsSummary:
      type: object
      properties:
        open_cases: { type: integer }
        high_priority: { type: integer }
        at_risk: { type: integer }
        resolved_today: { type: integer }
        repeat_contact_rate: { type: number }
        avg_resolution_hours: { type: number }
        broken_promise_rate: { type: ["number", "null"] }
        by_category:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPoint" }
        by_status:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPoint" }
        resolved_per_day:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPoint" }
        per_day:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPoint" }
      required: [open_cases, high_priority, at_risk, resolved_today, repeat_contact_rate, avg_resolution_hours, by_category, by_status, resolved_per_day]
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [New, Investigating, Awaiting Customer, Approved, Resolved, Rejected]
    Priority:
      name: priority
      in: query
      schema:
        type: string
        enum: [Low, Medium, High, Critical]
    Category:
      name: category
      in: query
      schema:
        type: string
        enum: [Damaged Product, Delivery Delay, Refund, Return, Warranty, Replacement, Cancellation, Other]
